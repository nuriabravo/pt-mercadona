spring:
  application:
    name: nuriabravo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mercadona}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

stores:
  api:
    base-url: ${STORE_URL:http://localhost:8081}

jwt:
  token:
    expiration: 24